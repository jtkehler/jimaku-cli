[project]
name = "jimaku-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jack Kehler", email = "jtkehler@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "guessit>=4.4.0",
