[project]
name = "jimaku-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jack Kehler", email = "jtkehler@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anitopy>=2.1.1",
    "ffsubsync>=0.5.1",
    "guessit>=4.4.0",
    "platformdirs>=4.11.1",
    "pysubs2>=1.8.1",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "thefuzz>=0.22.1",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

[project.scripts]
jimaku = "jimaku_cli.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
